name: Offline tests
on: [push, pull_request]
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-viewer.txt
      - run: python -m cdfv2.cli verify
      - run: python -m pytest -q
