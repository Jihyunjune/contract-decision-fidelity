[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contract-decision-fidelity"
version = "2.0.0"
description = "Reproducible ContractNLI decision fidelity evaluation and LongLLMLingua compression"
requires-python = ">=3.10,<3.13"
license = {file = "LICENSE"}
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["cdfv2*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires locally downloaded official data and model assets"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
ignore_missing_imports = true
follow_imports = "skip"
files = ["src/data/inputs.py", "src/decision/pipeline.py"]
